name: A correction to the text
description: A typo, a wrong citation, a broken figure, or a conversion error in the Markdown book. Each belongs in the next edition's list.
title: "[correction] "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        *"Nothing in this edition was changed silently. What was changed is listed."* Corrections are dated and attributed in the next edition.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Error in the book itself (also in the PDF)
        - Conversion error (the Markdown or site differs from the PDF)
        - Figure or plate
        - Reference or citation
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      placeholder: "Chapter Seven, p.49"
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: It now reads
      render: text
    validations:
      required: true
  - type: textarea
    id: should
    attributes:
      label: It should read
      render: text
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: How you would like to be credited (optional)
