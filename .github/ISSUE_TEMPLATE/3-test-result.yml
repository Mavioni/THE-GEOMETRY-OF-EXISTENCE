name: A test result
description: You ran one of the book's preregistered tests — the six-site system of §16, or the record protocol of Chapter Twenty-Three.
title: "[test] "
labels: ["test-result", "level-five", "measured"]
body:
  - type: markdown
    attributes:
      value: |
        *"Build the six-site system of §16 on a calibrated device and measure the difference in zero-site occupancy. The prediction is 0.276990454809."*
        Report it whichever way it came out. A claim that cannot lose cannot win.
  - type: dropdown
    id: protocol
    attributes:
      label: Protocol
      options:
        - "Protocol one: equal size, unequal shape (§16, Ch. 23)"
        - "Protocol two: the record (§15, Ch. 23)"
        - Other
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: Platform and calibration
      description: The device, how couplings and temperature were calibrated, and when — before any outcome data, as the protocol fixes.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result
      description: Measured value, standard error, sample counts, and both controls (swapped labels, coupling off).
    validations:
      required: true
  - type: input
    id: data
    attributes:
      label: Link to data and code
  - type: checkboxes
    id: blind
    attributes:
      label: Conditions
      options:
        - label: The analysis was blind to which graph is which.
        - label: The decision rule was fixed before the data were taken.
