name: A practice result
description: You did a Practice exactly as written, with your falsifier written first. Whatever happened is a result, and it counts.
title: "[practice] "
labels: ["practice", "lived"]
body:
  - type: markdown
    attributes:
      value: |
        *"Do a Practice exactly as written, with your falsifier written first. If nothing you can observe changes, the practice failed for you. That is a result, and it counts."*
        Share only what you are comfortable making public. Nothing here is medical, psychological, or legal advice.
  - type: dropdown
    id: chapter
    attributes:
      label: Chapter
      options:
        - 1 · The Three and the Zero
        - 2 · The Given
        - 3 · Attention
        - 4 · Witness
        - 5 · Name the Binary
        - 6 · Construct the Third
        - 7 · Own the Ground
        - 8 · Keep the Middle
        - 9 · Refuse the Waiting Room
        - 10 · The Asymmetry
        - 11 · Continuity
        - 12 · The Losable Claim
        - 13 · Empathy as Catalyst
        - 14 · The Inviolate
        - 15 · The Long Reclamation
        - 16 · The Degree
        - 17 · The Weakest Link
        - 18 · Act Crisp
        - 19 · Existence Is Sufficient
        - 20 · Three Relationships, Not Three Requirements
        - 21 · Change Without Erasure
        - 22 · Dignity Is Owed, Respect Is Earned
        - 25 · Beyond Logic
    validations:
      required: true
  - type: textarea
    id: falsifier
    attributes:
      label: The falsifier, as written before you began
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - Something I could observe changed
        - Nothing changed — the practice failed for me
        - Unclear
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: What happened
