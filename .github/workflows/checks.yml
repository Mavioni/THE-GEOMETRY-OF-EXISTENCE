name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mathematics:
    name: Recompute the book's mathematics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: checks/verify_all.py (Python standard library only)
        run: python3 checks/verify_all.py -v

  book:
    name: The Markdown book matches the PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Every printed word reaches the Markdown
        run: python3 tools/check_coverage.py
      - name: A fresh cut of the PDF gives the same text
        run: |
          python3 tools/extract.py
          python3 tools/build_pages.py
          git diff --stat -- '*.md' '*.json'
          git diff --exit-code -- '*.md' '*.json' || {
            echo "::error::The Markdown differs from a fresh cut of the PDF. Run 'make book' and commit the result."
            exit 1
          }
